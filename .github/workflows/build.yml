# Compila alterIVO y crea los dos instaladores:
#   - alterIVO-Mac-Instalador.pkg      (elige VST3 y/o AU)
#   - alterIVO-Windows-Instalador.exe  (VST3)
# En cada subida quedan en la pestaña "Actions" → último run → "Artifacts".
# Al crear una release con etiqueta tipo v1.0.0 se publican en "Releases".
name: Build alterIVO

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15-intel   # Intel: suele tener más máquinas libres que macos-latest
    env:
      AAX_SDK_URL: ${{ secrets.AAX_SDK_URL }}   # Pro Tools: vacío = sin AAX
    steps:
      - uses: actions/checkout@v4

      - name: AAX SDK (sólo si está configurado el secreto AAX_SDK_URL)
        if: env.AAX_SDK_URL != ''
        run: |
          curl -sL -o aax.zip "$AAX_SDK_URL" && unzip -q aax.zip -d aax
          echo "AAX_ARG=-DALTERIVO_AAX_SDK=$(cd aax/* && pwd)" >> $GITHUB_ENV

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release $AAX_ARG

      - name: Compilar
        run: cmake --build build --config Release -j 4

      - name: Validar con pluginval (VST3)
        continue-on-error: true
        run: |
          curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q -o pv.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --timeout-ms 900000 "build/AlterIvo_artefacts/Release/VST3/alterIVO.vst3" > pluginval-mac.txt 2>&1; echo "EXIT $?" >> pluginval-mac.txt
          tail -40 pluginval-mac.txt

      - name: Validar el Audio Unit (auval, la prueba que usa Logic)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/AlterIvo_artefacts/Release/AU/alterIVO.component" ~/Library/Audio/Plug-Ins/Components/
          codesign --force --deep -s - ~/Library/Audio/Plug-Ins/Components/alterIVO.component
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          { echo "== auval"; auval -strict -v aumf Aivo Ivob; echo "EXIT $?"; } > auval-mac.txt 2>&1
          { echo "== pluginval AU"; ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --timeout-ms 900000 ~/Library/Audio/Plug-Ins/Components/alterIVO.component; echo "EXIT $?"; } >> auval-mac.txt 2>&1
          grep -E "AU VALIDATION|PASSED|FAILED|SUCCESS|EXIT" auval-mac.txt | tail -20

      - name: Crear instalador .pkg
        run: bash packaging/mac/build-pkg.sh 1.0.0

      - name: Guardar en la rama "instalador-mac"
        run: |
          mkdir out && cp dist/alterIVO-Mac-Instalador.pkg out/ && (cp pluginval-mac.txt auval-mac.txt out/ || true) && cd out
          git init -q -b instalador-mac
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "alterIVO Mac"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" instalador-mac

      - uses: actions/upload-artifact@v4
        with:
          name: alterIVO-Mac-Instalador
          path: dist/alterIVO-Mac-Instalador.pkg

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/alterIVO-Mac-Instalador.pkg

  windows:
    runs-on: windows-latest
    env:
      AAX_SDK_URL: ${{ secrets.AAX_SDK_URL }}   # Pro Tools: vacío = sin AAX
    steps:
      - uses: actions/checkout@v4

      - name: AAX SDK (sólo si está configurado el secreto AAX_SDK_URL)
        if: env.AAX_SDK_URL != ''
        shell: bash
        run: |
          curl -sL -o aax.zip "$AAX_SDK_URL" && unzip -q aax.zip -d aax
          echo "AAX_ARG=-DALTERIVO_AAX_SDK=$(cd aax/* && pwd -W)" >> $GITHUB_ENV

      - name: Configurar
        shell: bash
        run: cmake -B build -A x64 $AAX_ARG

      - name: Compilar
        run: cmake --build build --config Release -j 4

      - name: Validar con pluginval (VST3)
        continue-on-error: true
        shell: bash
        run: |
          curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q -o pv.zip
          ./pluginval.exe --strictness-level 5 --validate-in-process --timeout-ms 900000 "build/AlterIvo_artefacts/Release/VST3/alterIVO.vst3" > pluginval-windows.txt 2>&1; echo "EXIT $?" >> pluginval-windows.txt
          tail -40 pluginval-windows.txt

      - name: Zip del VST3 (instalación copiando la carpeta, sin ejecutar nada)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\AlterIvo_artefacts\Release\VST3\alterIVO.vst3" -DestinationPath "dist\alterIVO-Windows-VST3.zip" -Force

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crear instalador .exe
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc "packaging\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Guardar en la rama "instalador-windows"
        shell: bash
        run: |
          mkdir out && cp dist/alterIVO-Windows-Instalador.exe dist/alterIVO-Windows-VST3.zip out/ && (cp pluginval-windows.txt out/ || true) && cd out
          git init -q -b instalador-windows
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "alterIVO Windows"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" instalador-windows

      - uses: actions/upload-artifact@v4
        with:
          name: alterIVO-Windows-Instalador
          path: dist/alterIVO-Windows-Instalador.exe

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/alterIVO-Windows-Instalador.exe

  # Junta los dos instaladores en una sola carpeta para compartir
  carpeta:
    needs: [ mac, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: descargas
          merge-multiple: true

      - name: Montar la carpeta
        run: |
          mkdir -p "alterIVO Instaladores"
          cp descargas/alterIVO-Mac-Instalador.pkg "alterIVO Instaladores/"
          cp descargas/alterIVO-Windows-Instalador.exe "alterIVO Instaladores/"
          cp packaging/LEEME.txt "alterIVO Instaladores/"
          ls -la "alterIVO Instaladores"

      - uses: actions/upload-artifact@v4
        with:
          name: alterIVO-Instaladores
          path: alterIVO Instaladores/
